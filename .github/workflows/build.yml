name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  protocol:
    name: protocol unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # No Android SDK on purpose: proves the protocol module stands on its own.
      - run: ./gradlew :protocol:test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-test-report
          path: protocol/build/reports/tests/test

  apps:
    name: watch + phone APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :wear:assembleDebug :mobile:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            wear/build/outputs/apk/debug/*.apk
            mobile/build/outputs/apk/debug/*.apk
