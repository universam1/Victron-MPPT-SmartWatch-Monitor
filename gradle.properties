org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Lets `./gradlew :protocol:test` run without configuring (and therefore without
# resolving the Android Gradle Plugin for) the Android modules. Keeps the pure-Kotlin
# protocol tests runnable on a machine that has no Android SDK at all.
org.gradle.configureondemand=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
